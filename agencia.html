<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TexClean - Módulo Agencia</title>
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #284F8F; }
    .card-custom {
      background-color: #1a335d;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body class="text-white">

  <!-- Navbar -->
  <nav class="navbar navbar-dark px-4 border-bottom border-white-50" style="background-color: #1a335d;">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1 fw-bold">🧺 TexClean - Gestión de Agencia</span>
      <div class="d-flex align-items-center gap-3">
        <span id="txtUsuario" class="badge bg-primary fs-6">Operador</span>
        <button id="btnLogout" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid p-4">
    <div class="row g-4">
      
      <!-- 1. REGISTRO DE CLIENTES -->
      <div class="col-md-4">
        <div class="card card-custom p-3 text-white">
          <h5 class="fw-bold mb-3 border-bottom border-secondary pb-2">👤 Registro de Cliente</h5>
          <div id="alertCliente" class="alert d-none py-2 fs-7" role="alert"></div>

          <form id="formCliente">
            <div class="mb-2">
              <label class="form-label small">Nombre Completo</label>
              <input type="text" id="cliNombre" class="form-control form-control-sm" required>
            </div>
            <div class="mb-2">
              <label class="form-label small">Documento / Cédula (Solo números, máx 15)</label>
              <input 
                type="text" 
                id="cliDocumento" 
                class="form-control form-control-sm" 
                maxlength="15" 
                pattern="[0-9]+" 
                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                placeholder="Ej: 1012345678" 
                required>
            </div>
            <div class="mb-2">
              <label class="form-label small">Teléfono (Solo números, máx 10)</label>
              <input 
                type="text" 
                id="cliTelefono" 
                class="form-control form-control-sm" 
                maxlength="10" 
                pattern="[0-9]+" 
                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                placeholder="Ej: 3001234567" 
                required>
            </div>
            <div class="mb-2">
              <label class="form-label small">Dirección (Opcional)</label>
              <input type="text" id="cliDireccion" class="form-control form-control-sm" placeholder="Ej: Calle 123 #45-67">
            </div>
            <div class="mb-3">
              <label class="form-label small">Correo Electrónico (Opcional)</label>
              <input type="email" id="cliCorreo" class="form-control form-control-sm" placeholder="opcional@correo.com">
            </div>
            <button type="submit" id="btnSaveCliente" class="btn btn-primary w-100 fw-bold btn-sm">Guardar Cliente</button>
          </form>
        </div>
      </div>

      <!-- 2. REGISTRO DE PEDIDOS (ORDEN DE LAVADO) -->
      <div class="col-md-8">
        <div class="card card-custom p-3 text-white">
          <h5 class="fw-bold mb-3 border-bottom border-secondary pb-2">📝 Orden de Lavado (Nuevo Pedido)</h5>
          <div id="alertPedido" class="alert d-none py-2 fs-7" role="alert"></div>

          <form id="formPedido">
            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label small">Seleccionar Cliente</label>
                <select id="selectCliente" class="form-select form-select-sm" required>
                  <option value="">Cargando clientes...</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small">Tipo de Servicio</label>
                <select id="pedServicio" class="form-select form-select-sm" required>
                  <option value="Lavado Seco">Lavado Seco</option>
                  <option value="Lavado por Kilos">Lavado por Kilos</option>
                  <option value="Planchado">Planchado</option>
                  <option value="Tintorería">Tintorería</option>
                </select>
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-md-3">
                <label class="form-label small">Tipo de Prenda</label>
                <input type="text" id="pedPrenda" class="form-control form-control-sm" placeholder="Ej: Saco, Camisa" required>
              </div>
              <div class="col-md-3">
                <label class="form-label small">Cantidad</label>
                <input type="number" id="pedCantidad" class="form-control form-control-sm" min="1" value="1" required>
              </div>
              <div class="col-md-3">
                <label class="form-label small">Color</label>
                <input type="text" id="pedColor" class="form-control form-control-sm" placeholder="Ej: Azul" required>
              </div>
              <div class="col-md-3">
                <label class="form-label small">Fecha Estimada Entrega</label>
                <input type="datetime-local" id="pedFechaEntrega" class="form-control form-control-sm" required>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label small">Observaciones / Estado Inicial de la Prenda</label>
              <input type="text" id="pedObs" class="form-control form-control-sm" placeholder="Ej: Sin botones, mancha en el cuello">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label small">Costo Total ($)</label>
                <input type="number" id="pedTotal" class="form-control form-control-sm" min="0" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small">Estado de Pago</label>
                <select id="pedEstadoPago" class="form-select form-select-sm" required>
                  <option value="Pendiente">Pendiente</option>
                  <option value="Abonado">Abonado</option>
                  <option value="Pagado">Pagado</option>
                </select>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 fw-bold btn-sm">Crear Orden y Recibir Prendas</button>
          </form>
        </div>
      </div>

      <!-- 3. FLUJO DE ESTADO DE LAS PRENDAS -->
      <div class="col-12">
        <div class="card card-custom p-3 text-white">
          <h5 class="fw-bold mb-3 border-bottom border-secondary pb-2">🔄 Control y Flujo de Prendas</h5>
          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle small">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Cliente</th>
                  <th>Detalle Prenda</th>
                  <th>Servicio</th>
                  <th>Entrega Est.</th>
                  <th>Total / Pago</th>
                  <th>Estado Prenda</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody id="tablaPedidos">
                <tr><td colspan="8" class="text-center text-muted">Cargando pedidos...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const supabase = require('./supabaseClient');
    const usuarioSesion = JSON.parse(sessionStorage.getItem('usuarioSesion'));

    if (!usuarioSesion || usuarioSesion.rol !== 'AGENCIA') {
      window.location.href = './login.html';
    }

    document.getElementById('txtUsuario').textContent = `${usuarioSesion.nombre} (Agencia #${usuarioSesion.id_agencia})`;

    // Cargar Lista de Clientes usando la columna 'documento'
    async function cargarClientes() {
      const select = document.getElementById('selectCliente');
      const { data: clientes } = await supabase.from('clientes').select('*').order('nombre');
      
      select.innerHTML = '<option value="">-- Seleccionar --</option>';
      if (clientes) {
        clientes.forEach(c => {
          select.innerHTML += `<option value="${c.id}">${c.nombre} (Doc: ${c.documento || 'N/A'})</option>`;
        });
      }
    }

    // Registrar Cliente con campos exactos de tu Supabase
    document.getElementById('formCliente').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const alert = document.getElementById('alertCliente');
      const btnSave = document.getElementById('btnSaveCliente');
      
      alert.classList.add('d-none');
      btnSave.disabled = true;
      btnSave.textContent = 'Guardando...';

      const documento = document.getElementById('cliDocumento').value.trim();
      const telefono = document.getElementById('cliTelefono').value.trim();
      const direccion = document.getElementById('cliDireccion').value.trim();
      const correo = document.getElementById('cliCorreo').value.trim();

      // Validaciones numéricas
      if (!/^\d{1,15}$/.test(documento)) {
        mostrarAlertaCliente('El documento debe contener solo números (máximo 15 dígitos).', 'danger');
        btnSave.disabled = false;
        btnSave.textContent = 'Guardar Cliente';
        return;
      }

      if (!/^\d{1,10}$/.test(telefono)) {
        mostrarAlertaCliente('El teléfono debe contener solo números (máximo 10 dígitos).', 'danger');
        btnSave.disabled = false;
        btnSave.textContent = 'Guardar Cliente';
        return;
      }

      // Estructura idéntica a tu tabla en Supabase
      const datosCliente = {
        nombre: document.getElementById('cliNombre').value.trim(),
        documento: documento,
        telefono: telefono,
        direccion: direccion !== '' ? direccion : null,
        correo: correo !== '' ? correo : null
      };

      try {
        const { data, error } = await supabase
          .from('clientes')
          .insert([datosCliente])
          .select();

        if (error) {
          console.error('Error de Supabase:', error);
          mostrarAlertaCliente(`Error al guardar: ${error.message}`, 'danger');
        } else {
          mostrarAlertaCliente('¡Cliente registrado con éxito!', 'success');
          document.getElementById('formCliente').reset();
          cargarClientes();
        }
      } catch (err) {
        console.error('Error de red/servidor:', err);
        mostrarAlertaCliente('Error de conexión al registrar cliente.', 'danger');
      } finally {
        btnSave.disabled = false;
        btnSave.textContent = 'Guardar Cliente';
      }
    });

    function mostrarAlertaCliente(mensaje, tipo) {
      const alert = document.getElementById('alertCliente');
      alert.className = `alert alert-${tipo} py-2 fs-7`;
      alert.textContent = mensaje;
      alert.classList.remove('d-none');
    }

    document.getElementById('formPedido').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alert = document.getElementById('alertPedido');
      const btnSubmit = e.target.querySelector('button[type="submit"]');

      try {
        btnSubmit.disabled = true;

        const datosPedido = {
          id_cliente: parseInt(document.getElementById('selectCliente').value, 10),
          id_agencia: usuarioSesion.id_agencia,
          id_usuario: usuarioSesion.id,
          total: parseFloat(document.getElementById('pedTotal').value),
          estado_pago: document.getElementById('pedEstadoPago').value,
          estado_pedido: 'Recibido',
          fecha_entrega_estimada: document.getElementById('pedFechaEntrega').value
        };

        const { data: pedidoCreado, error: errorPedido } = await supabase
          .from('pedidos')
          .insert([datosPedido])
          .select();

        if (errorPedido) throw errorPedido;

        const idPedidoGenerado = pedidoCreado[0].id;

        const datosDetalle = {
          id_pedido: idPedidoGenerado,
          tipo_prenda: document.getElementById('pedPrenda').value,
          color: document.getElementById('pedColor').value,
          marca: null,
          observaciones_estado: document.getElementById('pedObs').value,
          servicio_solicitado: document.getElementById('pedServicio').value,
          precio_unitario: parseFloat(document.getElementById('pedTotal').value)
        };

        const { error: errorDetalle } = await supabase
          .from('detalle_pedidos')
          .insert([datosDetalle]);

        if (errorDetalle) throw errorDetalle;

        alert.className = 'alert alert-success py-2 fs-7';
        alert.textContent = '¡Orden y prendas registradas con éxito!';
        alert.classList.remove('d-none');
        document.getElementById('formPedido').reset();

        cargarTablaPedidos();

      } catch (err) {
        console.error('Error al registrar la orden:', err);
        alert.className = 'alert alert-danger py-2 fs-7';
        alert.textContent = `Error al registrar orden: ${err.message || err}`;
        alert.classList.remove('d-none');
      } finally {
        btnSubmit.disabled = false;
      }
    });
    async function cargarTablaPedidos() {
      const tbody = document.getElementById('tablaPedidos');
      if (!tbody) return;

      const { data: pedidos, error } = await supabase
        .from('pedidos')
        .select(`
          id,
          total,
          estado_pago,
          estado_pedido,
          fecha_entrega_estimada,
          clientes ( nombre ),
          detalle_pedidos (
            tipo_prenda,
            color,
            servicio_solicitado
          )
        `)
        .eq('id_agencia', usuarioSesion.id_agencia)
        .order('id', { ascending: false });

      if (error) {
        console.error('Error al cargar la tabla:', error);
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Error al cargar pedidos.</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      if (!pedidos || pedidos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No hay prendas registradas.</td></tr>';
        return;
      }

      pedidos.forEach(p => {
        const detalle = p.detalle_pedidos?.[0] || {};
        const clienteNombre = p.clientes?.nombre || 'Sin Cliente';
        const detallePrenda = detalle.tipo_prenda
          ? `${detalle.tipo_prenda} (${detalle.color || ''})`
          : 'Sin detalle';
        const servicio = detalle.servicio_solicitado || 'General';
        const fechaEstimada = p.fecha_entrega_estimada
          ? new Date(p.fecha_entrega_estimada).toLocaleString('es-CO', { dateStyle: 'short', timeStyle: 'short' })
          : 'N/A';
        const estado = p.estado_pedido || 'Recibido';
        const fila = document.createElement('tr');

        fila.innerHTML = `
          <td>#${p.id}</td>
          <td>${clienteNombre}</td>
          <td>${detallePrenda}</td>
          <td>${servicio}</td>
          <td>${fechaEstimada}</td>
          <td>$${p.total} <br><span class="badge bg-secondary">${p.estado_pago || 'Pendiente'}</span></td>
          <td><span class="badge ${getBadgeColor(estado)}">${estado}</span></td>
          <td><button onclick="cambiarEstado(${p.id}, '${estado}')" class="btn btn-warning btn-sm py-0">Avanzar Estado</button></td>
        `;
        tbody.appendChild(fila);
      });
    }

    // Cambiar Flujo de Estado
    async function cambiarEstado(id, estadoActual) {
      let nuevoEstado = 'En Lavado';
      if (estadoActual === 'En Lavado') nuevoEstado = 'Listo para Entrega';
      else if (estadoActual === 'Listo para Entrega') nuevoEstado = 'Entregado';

      await supabase.from('pedidos').update({ estado_pedido: nuevoEstado }).eq('id', id);
      cargarTablaPedidos();
    }

    function getBadgeColor(estado) {
      if (estado === 'Recibido') return 'bg-danger';
      if (estado === 'En Lavado') return 'bg-warning text-dark';
      if (estado === 'Listo para Entrega') return 'bg-success';
      return 'bg-secondary';
    }

    // Cerrar Sesion
    document.getElementById('btnLogout').addEventListener('click', () => {
      sessionStorage.removeItem('usuarioSesion');
      window.location.href = './login.html';
    });

    // Iniciar
    cargarClientes();
    cargarTablaPedidos();
  </script>
</body>
</html>
