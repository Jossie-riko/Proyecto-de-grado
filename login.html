<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TexClean - Iniciar Sesión</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="bg-body-tertiary">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="col-12 col-sm-9 col-md-7 col-lg-5 col-xl-4">
      <form id="loginForm" class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5 text-center">
          
          <div class="mb-3"> <img src="./Imagenes/Logo.svg" alt="TexClean" width="64" height="64"></div>
          <h1 class="h3 mb-1 fw-bold">TexClean</h1>
          <p class="text-body-secondary mb-4">Bogotá - Sistema de Gestión</p>

          <div id="alertError" class="alert alert-danger d-none text-start" role="alert" aria-live="polite"></div>
          <div id="alertSuccess" class="alert alert-success d-none text-start" role="status" aria-live="polite"></div>

          <div class="form-floating mb-3 text-start">
            <input type="email" class="form-control" id="emailInput" placeholder="nombre@ejemplo.com" autocomplete="username" required>
            <label for="emailInput">Correo electrónico</label>
          </div>

          <div class="form-floating mb-3 text-start">
            <input type="password" class="form-control" id="passwordInput" placeholder="Contraseña" autocomplete="current-password" required>
            <label for="passwordInput">Contraseña</label>
          </div>

          <button id="btnLogin" class="btn btn-primary w-100 py-2" type="submit">Ingresar</button>
          <p class="mt-4 mb-0 text-body-secondary small">&copy; TexClean 2026</p>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import { supabase } from './supabaseClient.js';

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const alertError = document.getElementById('alertError');
      const alertSuccess = document.getElementById('alertSuccess');
      const btnLogin = document.getElementById('btnLogin');

      alertError.classList.add('d-none');
      alertSuccess.classList.add('d-none');
      btnLogin.disabled = true;
      btnLogin.textContent = 'Verificando...';

      const correo = document.getElementById('emailInput').value.trim();
      const clave = document.getElementById('passwordInput').value.trim();

      try {
        const { data: usuario, error } = await supabase
          .from('usuarios')
          .select('id, nombre, correo, rol, id_agencia, estado')
          .eq('correo', correo)
          .eq('clave', clave)
          .single();

        if (error || !usuario) {
          alertError.textContent = 'Correo o contraseña incorrectos.';
          alertError.classList.remove('d-none');
          return;
        }

        if (!usuario.estado) {
          alertError.textContent = 'Esta cuenta se encuentra inactiva.';
          alertError.classList.remove('d-none');
          return;
        }

        // Se guarda en sessionStorage para que se cierre al cerrar la ventana
        sessionStorage.setItem('usuarioSesion', JSON.stringify(usuario));
        alertSuccess.textContent = '¡Inicio de sesión correcto! Redirigiendo...';
        alertSuccess.classList.remove('d-none');

        setTimeout(() => {
          if (usuario.rol === 'AGENCIA') {
            window.location.href = './agencia.html';
          } else {
            window.location.href = './index.html';
          }
        }, 1200);

      } catch (err) {
        console.error('Error al iniciar sesión con Supabase:', err);
        alertError.textContent = `No fue posible iniciar sesión: ${err.message || 'error de conexión con Supabase.'}`;
        alertError.classList.remove('d-none');
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
